spring:
  application:
    name: controle-financeiro
  datasource:
      url: jdbc:postgresql://localhost:5432/controle_financeiro
      username: app_controle
      password: ${DB_PASSWORD}
  jpa:
      open-in-view: false
      hibernate:
         ddl-auto: update
      show-sql: true
      properties:
       hibernate:
          format_sql: true

